<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haber Takip</title>
<style>
:root{--bg:#eef1f5;--fg:#14202e;--mut:#5f6c7b;--line:#d5dce5;--card:#fff;--acc:#1f5eff;--new:#ffb020;--bad:#d23b3b;--ok:#1f9d55}
@media(prefers-color-scheme:dark){:root{--bg:#0f1620;--fg:#e6edf5;--mut:#8b99aa;--line:#233040;--card:#16202c;--acc:#6ea0ff;--ok:#3ec97a;--bad:#ff6b6b}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.toolbar input{flex:1;min-width:150px}#count,#message{font-size:13px;color:var(--mut)}#message:empty{display:none}.ti{overflow-wrap:anywhere}.chip{max-width:100%}.chip .f{overflow-wrap:anywhere}button{min-height:32px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px max(16px,calc(50% - 480px)) 10px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.02em;font-weight:750}
.live{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.live .dot{animation:p 1s infinite}@keyframes p{50%{opacity:.25}}
.live.off .dot{background:var(--bad);animation:none}
form{display:flex;gap:6px;margin-left:auto}
input,select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
input{width:200px}
button{font:inherit;cursor:pointer;color:var(--fg)}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:13px}
.chip.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chip .f{border:0;background:none;padding:0}
.retry-status{display:block;font-size:11px;font-weight:400;color:var(--mut)}
.retry-status:empty{display:none}
.chip b{font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.chip .x{border:0;background:none;color:var(--mut);padding:0 6px;font-size:15px;line-height:1}
.chip .x:hover{color:var(--bad)}
main{padding:6px max(16px,calc(50% - 480px)) 12px}.pagination{text-align:center;padding:4px 16px 48px}button:disabled{cursor:wait;opacity:.65}
.row{display:grid;grid-template-columns:80px 1fr;gap:4px 14px;padding:11px 12px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;border-left:4px solid transparent}
.row:hover{background:var(--card)}
.row.new{border-left-color:var(--new);background:color-mix(in srgb,var(--new) 12%,transparent)}
.tm{font-variant-numeric:tabular-nums;font-weight:600}
.ago{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.ti{font-size:16.5px;font-weight:600;line-height:1.35}
.row:hover .ti{color:var(--acc)}
.sn{font-size:13px;font-weight:600}
.empty{padding:60px 16px;text-align:center;color:var(--mut)}
@media(max-width:620px){form{margin-left:0;width:100%}input{flex:1;width:auto}.row{grid-template-columns:72px 1fr;gap:4px 10px}}
@media(prefers-reduced-motion:reduce){.live .dot{animation:none}}
</style></head><body>
<header>
 <div class="top">
  <h1>Haber Takip <small id="ver" style="font-size:12px;font-weight:500;color:var(--mut)"></small></h1>
  <span class="live" id="live"><i class="dot"></i><span id="st">Bağlanıyor…</span></span>
  <label style="font-size:13px;color:var(--mut)">Tarama <select id="iv"><option value="5">5 sn</option><option value="10">10 sn</option><option value="15">15 sn</option><option value="30">30 sn</option><option value="60">60 sn</option><option value="120">2 dk</option><option value="300">5 dk</option></select></label>
  <button class="btn" id="snd" type="button" aria-pressed="false">Ses kapalı</button>
  <button class="btn" id="rd" type="button">Hepsini okundu yap</button>
  <form id="f"><input id="dm" aria-label="Site veya RSS adresi" placeholder="Site veya RSS adresi" required autocomplete="off"><button class="btn on">Ekle</button></form>
 </div>
 <div class="toolbar">
  <input id="search" type="search" placeholder="Haberlerde ara…" aria-label="Haberlerde ara">
  <button class="btn" id="unread" type="button" aria-pressed="false">Yalnızca okunmamış</button>
  <span id="count"></span>
 </div>
 <p id="message" role="status" aria-live="polite"></p>
 <div class="chips" id="chips"></div>
</header>

<main id="list"><div class="empty">Haber hizmeti bağlantısı bekleniyor.</div></main>
<div class="pagination"><button id="more" class="btn" type="button" hidden>Daha fazla</button></div>
<script src="bridge-config.js"></script>
<script src="app.js"></script>
</body></html>
