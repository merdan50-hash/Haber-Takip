name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Motor testleri
        run: node --test test/*.test.js
      - name: Sözdizimi denetimi
        run: |
          for f in app.js background.js motor.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
          bash -n .github/magaza-yayinla.sh
      - name: Paketleme
        run: ./paketle.sh
      - name: Gerçek Chromium'da gerçek haber siteleriyle deneme
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node test/gercek-siteler.js dist/haber-takip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekran-goruntusu
          path: ekran.png
