name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Motor testleri
        run: node --test test/*.test.js
      - name: Sözdizimi denetimi
        run: |
          for f in app.js background.js motor.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
          bash -n .github/magaza-yayinla.sh
      - name: Paketleme
        run: ./paketle.sh
      - name: Chromium'u hazırla
        timeout-minutes: 6
        run: |
          npm install --no-save playwright@1
          # Ubuntu çalıştırıcısında tarayıcı bağımlılıkları hazır; --with-deps apt beklemesine takılabiliyor.
          npx playwright install chromium
      - name: Gerçek Chromium'da gerçek haber siteleriyle deneme
        timeout-minutes: 5
        run: node test/gercek-siteler.js dist/haber-takip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekran-goruntusu
          path: ekran.png
