name: Release

# Testleri çalıştırır, eklenti ve macOS paketlerini oluşturup GitHub Release olarak yayınlar.
# İki yolla çalışır: "v1.2.1" gibi bir etiket göndermek ya da Actions sekmesinden "Run workflow".
# Elle çalıştırıldığında etiketi manifest.json'daki sürümden kendisi oluşturur.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürümü belirle
        id: version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Etiket ($GITHUB_REF_NAME) manifest sürümüyle (v$version) eşleşmiyor."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Testler
        run: |
          python3 -m unittest discover -s hizmet -v
          node --check app.js && node --check background.js
          bash -n macos/kur.command && bash -n macos/kaldir.command

      - name: Paketleri oluştur
        run: ./paketle.sh

      - name: Sürüm notlarını CHANGELOG'dan al
        run: |
          awk -v v="## ${{ steps.version.outputs.version }}" \
            '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Sürüm ${{ steps.version.outputs.version }}" > notes.md

      - name: Release yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG sürümü zaten yayınlanmış. Yeni sürüm için manifest.json'daki sürümü artırın."
            exit 1
          fi
          gh release create "$TAG" "dist/haber-takip-mac-$VERSION.zip" "dist/haber-takip-$VERSION.zip" --target "$GITHUB_SHA" \
            --title "Haber Takip $VERSION" --notes-file notes.md
