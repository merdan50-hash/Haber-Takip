name: Release

# Testleri çalıştırır, eklenti paketini GitHub Release olarak ve (gizli değerler tanımlıysa)
# Chrome Web Mağazası ile Edge Eklentileri'nde yayınlar. Ayarlar için magaza/KURULUM.md.
# İki yolla çalışır: "v1.2.1" gibi bir etiket göndermek ya da Actions sekmesinden "Run workflow".
# Elle çalıştırıldığında etiketi manifest.json'daki sürümden kendisi oluşturur.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sürümü belirle
        id: version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Etiket ($GITHUB_REF_NAME) manifest sürümüyle (v$version) eşleşmiyor."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Testler
        run: node --test test/*.test.js

      - name: Paketi oluştur
        run: ./paketle.sh

      - name: Sürüm notlarını CHANGELOG'dan al
        run: |
          awk -v v="## ${{ steps.version.outputs.version }}" \
            '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Sürüm ${{ steps.version.outputs.version }}" > notes.md

      - name: Release yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG sürümü zaten yayınlanmış. Yeni sürüm için manifest.json'daki sürümü artırın."
            exit 1
          fi
          gh release create "$TAG" "dist/haber-takip-$VERSION.zip" "dist/haber-takip-$VERSION-magaza.zip" \
            --target "$GITHUB_SHA" --title "Haber Takip $VERSION" --notes-file notes.md

      # Mağazalardan yüklenen eklentiler yeni sürümü tarayıcının kendi güncellemesiyle alır.
      - name: Chrome Web Mağazası ve Edge Eklentileri'ne yayınla
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: .github/magaza-yayinla.sh "dist/haber-takip-${{ steps.version.outputs.version }}-magaza.zip" "${{ steps.version.outputs.version }}"
